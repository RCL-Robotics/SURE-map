# SURE-Map uncertainty-guided point filtering on Neural RGB-D.
workspace: outputs/neural_rgbd

datasets:
  - neural_rgbd

methods:
  - sure_map

point_filtering:
  dataset: neural_rgbd
  method: sure_map
  variants:
    - raw
    - unc_filter
  # Percentage of the highest-uncertainty candidate points filtered.
  uncertainty_filter_percent: 20.0
  voxel_size: 0.0078125
  icp_threshold: 0.1

evaluation:
  traj:
    enable: false
  auc:
    enable: false
  depth:
    enable: false
  points:
    enable: true
    vis: false
    icp_threshold: 0.1
