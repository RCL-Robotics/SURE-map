# SURE-Map uncertainty-guided point filtering on the masked DTU test set.
workspace: outputs/dtu

datasets:
  - dtu

methods:
  - sure_map

point_filtering:
  dataset: dtu
  method: sure_map
  variants:
    - raw
    - unc_filter
  # Percentage of the highest-uncertainty candidate points filtered.
  uncertainty_filter_percent: 20.0
  # Compute the percentile within the masked GT/prediction overlap.
  filter_scope: common_valid
  voxel_size: 0.0078125
  icp_threshold: 0.1
  eval_area_budget: 255000
  align: 14

evaluation:
  traj:
    enable: false
  auc:
    enable: false
  depth:
    enable: false
  points:
    enable: true
    vis: false
    icp_threshold: 0.1
